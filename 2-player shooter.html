<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <title>2 Player Shoot</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }
    #gameContainer {
      position: relative;
      margin-top: 10px;
    }
    canvas {
      background: #222;
      border: 2px solid #555;
      display: block;
    }
    #hud {
      margin-top: 10px;
      font-size: 18px;
    }
    #controls {
      margin-top: 5px;
      font-size: 14px;
      color: #ccc;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>2 Player Shoot</h1>
  <div id="gameContainer">
    <canvas id="game" width="900" height="500"></canvas>
  </div>
  <div id="hud">
    P1: <span id="score1">0</span> &nbsp;|&nbsp;
    P2: <span id="score2">0</span>
  </div>
  <div id="controls">
    <div><b>Spiller 1:</b> WASD = bevegelse, F = skyt</div>
    <div><b>Spiller 2:</b> Piltaster = bevegelse, L = skyt</div>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const score1El = document.getElementById("score1");
    const score2El = document.getElementById("score2");

    const W = canvas.width;
    const H = canvas.height;

    const keys = {};

    window.addEventListener("keydown", (e) => {
      keys[e.key.toLowerCase()] = true;
    });

    window.addEventListener("keyup", (e) => {
      keys[e.key.toLowerCase()] = false;
    });

    class Player {
      constructor(x, y, color, controls, facing) {
        this.x = x;
        this.y = y;
        this.w = 30;
        this.h = 30;
        this.color = color;
        this.speed = 4;
        this.controls = controls;
        this.facing = facing; // 1 = høyre, -1 = venstre
        this.cooldown = 0;
        this.score = 0;
      }

      update() {
        // Bevegelse
        if (keys[this.controls.left])  { this.x -= this.speed; this.facing = -1; }
        if (keys[this.controls.right]) { this.x += this.speed; this.facing = 1; }
        if (keys[this.controls.up])    { this.y -= this.speed; }
        if (keys[this.controls.down])  { this.y += this.speed; }

        // Begrens til canvas
        if (this.x < 0) this.x = 0;
        if (this.y < 0) this.y = 0;
        if (this.x + this.w > W) this.x = W - this.w;
        if (this.y + this.h > H) this.y = H - this.h;

        // Skyt
        if (this.cooldown > 0) this.cooldown--;
        if (keys[this.controls.shoot] && this.cooldown === 0) {
          this.shoot();
          this.cooldown = 15; // frames mellom skudd
        }
      }

      shoot() {
        const bulletSpeed = 8 * this.facing;
        const bx = this.facing === 1 ? this.x + this.w : this.x;
        const by = this.y + this.h / 2 - 3;
        bullets.push(new Bullet(bx, by, bulletSpeed, this));
      }

      draw() {
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.w, this.h);
      }

      respawn(side) {
        if (side === "left") {
          this.x = 50;
          this.y = H / 2 - this.h / 2;
          this.facing = 1;
        } else {
          this.x = W - 50 - this.w;
          this.y = H / 2 - this.h / 2;
          this.facing = -1;
        }
      }
    }

    class Bullet {
      constructor(x, y, vx, owner) {
        this.x = x;
        this.y = y;
        this.w = 10;
        this.h = 6;
        this.vx = vx;
        this.owner = owner;
        this.active = true;
      }

      update() {
        this.x += this.vx;
        if (this.x < -50 || this.x > W + 50) {
          this.active = false;
        }
      }

      draw() {
        ctx.fillStyle = "#ffeb3b";
        ctx.fillRect(this.x, this.y, this.w, this.h);
      }
    }

    function rectsCollide(a, b) {
      return (
        a.x < b.x + b.w &&
        a.x + a.w > b.x &&
        a.y < b.y + b.h &&
        a.y + a.h > b.y
      );
    }

    const player1 = new Player(
      50,
      H / 2 - 15,
      "#4caf50",
      {
        up: "w",
        down: "s",
        left: "a",
        right: "d",
        shoot: "f"
      },
      1
    );

    const player2 = new Player(
      W - 80,
      H / 2 - 15,
      "#f44336",
      {
        up: "arrowup",
        down: "arrowdown",
        left: "arrowleft",
        right: "arrowright",
        shoot: "l"
      },
      -1
    );

    let bullets = [];

    function update() {
      player1.update();
      player2.update();

      bullets.forEach(b => b.update());
      bullets = bullets.filter(b => b.active);

      // Kollisjon kuler vs spillere
      bullets.forEach(b => {
        if (!b.active) return;

        if (b.owner === player1 && rectsCollide(b, player2)) {
          b.active = false;
          player1.score++;
          score1El.textContent = player1.score;
          player2.respawn("right");
        } else if (b.owner === player2 && rectsCollide(b, player1)) {
          b.active = false;
          player2.score++;
          score2El.textContent = player2.score;
          player1.respawn("left");
        }
      });
    }

    function drawArena() {
      ctx.strokeStyle = "#444";
      ctx.lineWidth = 2;
      ctx.strokeRect(10, 10, W - 20, H - 20);

      // Midtlinje
      ctx.setLineDash([5, 5]);
      ctx.beginPath();
      ctx.moveTo(W / 2, 10);
      ctx.lineTo(W / 2, H - 10);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      drawArena();
      player1.draw();
      player2.draw();
      bullets.forEach(b => b.draw());
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
